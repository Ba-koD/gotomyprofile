name: Release

# Push a tag like v1.3 (matching "version" in manifest.json) to build the
# Chrome Web Store zip and publish it as a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build zip
        run: |
          # Tracked files only, with manifest.json at the zip root.
          # README.md and .git* files (.github, .gitignore, ...) are left out.
          git archive --format=zip -o "gotomyprofile-$VERSION.zip" HEAD -- . ':!README.md' ':!.git*'
          unzip -l "gotomyprofile-$VERSION.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "gotomyprofile-$VERSION.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
